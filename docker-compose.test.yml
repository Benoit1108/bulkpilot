# E2E / acceptance: runs the *production* image (static SPA, FrankenPHP worker, prod kernel)
# with throwaway data, exactly as it will be deployed. Use `make e2e-prod` (or `make ci`).
name: bulkpilot-test

x-e2e-environment: &e2e-environment
      APP_SECRET: test-only-not-a-secret-4f1c2b9e8d7a6f5e
      APP_ENCRYPTION_KEY: ZTJlLW9ubHktbm90LWEtc2VjcmV0LWtleS0zMmJ5dGU= # gitleaks:allow (readable non-secret key)
      # app.e2e.test: the same site under a dotted name, for clients that only send SNI for one (ZAP's Java).
      SERVER_NAME: localhost, https://php, https://app.e2e.test
      CADDY_SERVER_EXTRA_DIRECTIVES: tls internal
      # Links in emails must open in the Playwright browser.
      DEFAULT_URI: https://php
      MAILER_DSN: smtp://mailer:1025
      MAILER_FROM: no-reply@e2e.test
      REGISTRATION_ENABLED: "true"
      # Scans are answered by the fake product database: no call to Open Food Facts from CI.
      FOOD_DATABASE: fake
      ALLOW_FAKE_PROVIDERS: "1"
      # Every E2E test creates its own account from the same IP.
      RATE_LIMIT_SIGN_IN_IP: "1000"
      RATE_LIMIT_REGISTRATION: "1000"
      RATE_LIMIT_EMAIL_LINKS: "1000"
      # Photos in an S3-compatible bucket, as in production: written by the server over the
      # internal network, read by the browser through presigned links over TLS (ADR-0027).
      MEDIA_STORAGE: s3
      S3_ENDPOINT: http://s3:7070
      S3_PUBLIC_ENDPOINT: https://s3-tls
      S3_BUCKET: bulkpilot-photos
      S3_ACCESS_KEY: e2e-access-key
      S3_SECRET_KEY: e2e-only-not-a-secret # gitleaks:allow (readable non-secret key)
      S3_PATH_STYLE: "true"

services:
  php:
    environment:
      <<: *e2e-environment
    networks:
      default:
        aliases: [app.e2e.test]
    ports: !reset []
    # The CIQUAL excerpt the E2E tests search (tests/ is not in the production image).
    volumes:
      - ./api/tests/Fixtures/ciqual:/fixtures/ciqual:ro
    depends_on:
      mailer:
        condition: service_healthy
      s3:
        condition: service_healthy

  # The exports are made by the worker, as in production (async only: no schedule runs during the tests).
  worker:
    command: ["bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=192M"]
    environment:
      <<: *e2e-environment
      RUN_MIGRATIONS: "0"
      # Backups to their own bucket on the same gateway; created then restored by `make e2e-prod`.
      BACKUP_ENABLED: "1"
      BACKUP_PASSPHRASE: e2e-only-not-a-secret-passphrase-0123456789 # gitleaks:allow
      BACKUP_S3_ENDPOINT: http://s3:7070
      BACKUP_S3_BUCKET: bulkpilot-backups
      # The gateway has one key only: production refuses the photos' key for the backups.
      ALLOW_SHARED_BACKUP_KEY: "1"
      BACKUP_S3_ACCESS_KEY: e2e-access-key
      BACKUP_S3_SECRET_KEY: e2e-only-not-a-secret # gitleaks:allow (readable non-secret key)
      BACKUP_S3_PATH_STYLE: "true"
    volumes:
      - ./api/tests/Fixtures/ciqual:/fixtures/ciqual:ro
    depends_on:
      s3:
        condition: service_healthy

  database:
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql

  mailer:
    image: axllent/mailpit:v1.31.3
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # S3-compatible gateway: checks SigV4 signatures, presigned
  # links included. The bucket is a directory of its posix backend, created before it starts.
  s3:
    image: versity/versitygw:v1.8.0
    entrypoint: ["sh", "-c", "mkdir -p /data/bulkpilot-photos /data/bulkpilot-backups && exec versitygw --access e2e-access-key --secret e2e-only-not-a-secret posix /data"] # gitleaks:allow
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7070"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The bucket over TLS, as a provider serves it: the browser loads photos from an https page.
  # The Host header is kept, so the presigned signature (made for s3-tls) still matches.
  s3-tls:
    image: caddy:2.11.4-alpine
    command: ["caddy", "reverse-proxy", "--from", "https://s3-tls", "--to", "s3:7070", "--internal-certs"]
    depends_on:
      s3:
        condition: service_healthy

  # OWASP ZAP baseline against this stack (`make zap`, run by `make e2e-prod`): see zap/scan.sh.
  zap:
    profiles: [zap]
    image: zaproxy/zap-stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    entrypoint: ["sh", "/zap/wrk/scan.sh"]
    environment:
      HOME: /tmp
      ZAP_TARGET: https://app.e2e.test
      # `make zap-active` sets 1: ZAP then attacks the API (never in CI, never against real data).
      ZAP_ACTIVE: ${ZAP_ACTIVE:-0}
    volumes:
      - ./zap:/zap/wrk
    depends_on:
      php:
        condition: service_healthy

  # `make perf` (docs/TESTING.md): years of demo data seeded through the use cases by the *dev*
  # image (the command does not exist in the production one, ADR-0032), then k6 against the
  # production image.
  seed:
    profiles: [perf]
    image: ${IMAGES_PREFIX:-}bulkpilot-php-dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    entrypoint: ["sh", "-c"]
    # The code and vendor/ of the checkout (`make perf` installs vendor/ first when it is missing),
    # never its cache or logs: var/ is a throwaway tmpfs, so a running dev stack is left alone.
    # One process per account, side by side: years of history each take a few minutes.
    command:
      - |
        [ -f vendor/autoload.php ] || { echo 'api/vendor/ is missing: run composer install first (make perf does).' >&2; exit 1; }
        # What the processes share is built once: the container's cache, the exercise library.
        bin/console cache:warmup --no-debug -q && bin/console training:library:import --no-debug -q || exit 1
        pids=''
        for number in $$(seq 1 $${PERF_ACCOUNTS:-5}); do
          php -d memory_limit=512M bin/console app:demo:seed --years=$${PERF_YEARS:-3} --number=$$number --no-debug --no-ansi -q & pids="$$pids $$!"
        done
        for pid in $$pids; do wait $$pid || exit 1; done
    environment:
      <<: *e2e-environment
      PERF_ACCOUNTS: ${PERF_ACCOUNTS:-5}
      PERF_YEARS: ${PERF_YEARS:-3}
      APP_ENV: dev
      APP_DEBUG: "0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-18}&charset=utf8
      MAILER_DSN: null://null
      MEDIA_STORAGE: local
      BACKUP_ENABLED: "0"
    volumes:
      - ./api:/app
      - type: tmpfs
        target: /app/var
        tmpfs:
          mode: 01777
    depends_on:
      database:
        condition: service_healthy

  k6:
    profiles: [perf]
    image: grafana/k6@sha256:e66db15b860113878fa74670e31f5e274830b7b6e42c8bff28b2f2d86a257603 # v2.3.0
    command: ["run", "--quiet", "/scripts/scenario.js"]
    environment:
      BASE_URL: https://php
      DURATION: ${PERF_DURATION:-60s}
      ACCOUNTS: ${PERF_ACCOUNTS:-5}
      K6_P95_MS: ${K6_P95_MS:-300}
    volumes:
      - ./k6:/scripts:ro
    depends_on:
      php:
        condition: service_healthy
