parameters:
    # The session cookie's name where SESSION_COOKIE_NAME is not set (development, tests).
    session_cookie_name: sid

framework:
    secret: '%env(APP_SECRET)%'

    # Behind a TLS-terminating proxy (production: Tailscale, docs/DEPLOYMENT.md): the client's
    # address, scheme and host come from its X-Forwarded-* headers, trusted only from these
    # addresses (the server's compose network, which only the proxy reaches) and for these host
    # names (the public one). Empty (development, tests): nothing is trusted, any host is served.
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host']
    trusted_hosts: '%env(default::TRUSTED_HOSTS)%'

    # Sessions live in PostgreSQL (table `sessions`): they survive restarts and deployments,
    # and one device session per sign-in is tracked in `user_sessions` (ADR-0008).
    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        # One name per environment on the server (deploy/compose.yaml): production and staging
        # never share a session cookie.
        name: '%env(default:session_cookie_name:SESSION_COOKIE_NAME)%'
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax
        # An installed PWA stays signed in for 30 days of inactivity.
        cookie_lifetime: 2592000
        gc_maxlifetime: 2592000

    rate_limiter:
        # Keyed by IP + email: slows down guessing one account's password.
        sign_in:
            policy: sliding_window
            limit: '%env(int:RATE_LIMIT_SIGN_IN)%'
            interval: '15 minutes'
        # Keyed by IP: slows down credential stuffing across accounts.
        sign_in_ip:
            policy: sliding_window
            limit: '%env(int:RATE_LIMIT_SIGN_IN_IP)%'
            interval: '15 minutes'
        # Keyed by account only: password guessing spread over many IPs is still bounded.
        sign_in_account:
            policy: sliding_window
            limit: '%env(int:RATE_LIMIT_SIGN_IN_ACCOUNT)%'
            interval: '1 hour'
        # Keyed by account: re-entering the password on a signed-in device (2FA changes,
        # password change) cannot be used to guess it from a stolen session.
        password_confirm:
            policy: sliding_window
            limit: '%env(int:RATE_LIMIT_PASSWORD_CONFIRM)%'
            interval: '15 minutes'
        registration:
            policy: sliding_window
            limit: '%env(int:RATE_LIMIT_REGISTRATION)%'
            interval: '1 hour'
        # Keyed by account: at most 5 second-factor guesses per 15 minutes, whatever the session.
        second_factor:
            policy: sliding_window
            limit: '%env(int:RATE_LIMIT_SECOND_FACTOR)%'
            interval: '15 minutes'
        # Reset emails, verification resends, and link redemption attempts (keyed by IP).
        email_links:
            policy: sliding_window
            limit: '%env(int:RATE_LIMIT_EMAIL_LINKS)%'
            interval: '1 hour'
        # Keyed by account: each scan may call Open Food Facts, which asks for < 100 reads a minute.
        barcode_scan:
            policy: sliding_window
            limit: '%env(int:RATE_LIMIT_BARCODE_SCAN)%'
            interval: '1 minute'
        # Keyed by account: training writes (a workout synced after a long offline session sends a burst).
        training_writes:
            policy: sliding_window
            limit: '%env(int:RATE_LIMIT_TRAINING_WRITES)%'
            interval: '1 minute'
        # Keyed by account: weigh-ins, goals, measurements, photos.
        progression_writes:
            policy: sliding_window
            limit: '%env(int:RATE_LIMIT_PROGRESSION_WRITES)%'
            interval: '1 minute'
        # Keyed by account: the time zone the PWA reports and the dashboard layout.
        preference_writes:
            policy: sliding_window
            limit: '%env(int:RATE_LIMIT_PREFERENCE_WRITES)%'
            interval: '1 minute'
        # Keyed by account: analyses (each reads every context), decisions, settings.
        coach_writes:
            policy: sliding_window
            limit: '%env(int:RATE_LIMIT_COACH_WRITES)%'
            interval: '1 minute'
        # Keyed by account: checks as the app opens, marking read, settings.
        notification_writes:
            policy: sliding_window
            limit: '%env(int:RATE_LIMIT_NOTIFICATION_WRITES)%'
            interval: '1 minute'
        # Keyed by account: exports asked for (each reads every context and builds an archive).
        export_writes:
            policy: sliding_window
            limit: '%env(int:RATE_LIMIT_EXPORT_WRITES)%'
            interval: '1 day'
        # Keyed by account: links to a ready export (each one traced).
        export_downloads:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        # Global: Open Food Facts asks one application for < 100 product reads a minute.
        open_food_facts:
            policy: sliding_window
            limit: 90
            interval: '1 minute'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
