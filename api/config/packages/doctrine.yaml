doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        # The HTTP session table is owned by PdoSessionHandler, not by the ORM mapping.
        schema_filter: '~^(?!sessions$)~'
        types:
            user_id: App\Shared\Infrastructure\Persistence\Doctrine\UserIdType
            user_session_id: App\Identity\Infrastructure\Persistence\Doctrine\Type\UserSessionIdType
            one_time_token_id: App\Identity\Infrastructure\Persistence\Doctrine\Type\OneTimeTokenIdType
            email_address: App\Identity\Infrastructure\Persistence\Doctrine\Type\EmailAddressType
            hashed_password: App\Identity\Infrastructure\Persistence\Doctrine\Type\HashedPasswordType
            external_identity_id: App\Identity\Infrastructure\Persistence\Doctrine\Type\ExternalIdentityIdType
            encrypted_secret: App\Identity\Infrastructure\Persistence\Doctrine\Type\EncryptedSecretType
            food_id: App\Nutrition\Infrastructure\Persistence\Doctrine\Type\FoodIdType
            journal_entry_id: App\Nutrition\Infrastructure\Persistence\Doctrine\Type\JournalEntryIdType
            nutrition_target_id: App\Nutrition\Infrastructure\Persistence\Doctrine\Type\NutritionTargetIdType
            food_portions: App\Nutrition\Infrastructure\Persistence\Doctrine\Type\PortionsType
            energy_estimate: App\Nutrition\Infrastructure\Persistence\Doctrine\Type\EnergyEstimateType
            recipe_id: App\Nutrition\Infrastructure\Persistence\Doctrine\Type\RecipeIdType
            favorite_meal_id: App\Nutrition\Infrastructure\Persistence\Doctrine\Type\FavoriteMealIdType
            recipe_ingredients: App\Nutrition\Infrastructure\Persistence\Doctrine\Type\IngredientsType
            favorite_items: App\Nutrition\Infrastructure\Persistence\Doctrine\Type\FavoriteItemsType
            barcode: App\Nutrition\Infrastructure\Persistence\Doctrine\Type\BarcodeType
            exercise_id: App\Training\Infrastructure\Persistence\Doctrine\Type\ExerciseIdType
            exercise_note_id: App\Training\Infrastructure\Persistence\Doctrine\Type\ExerciseNoteIdType
            program_id: App\Training\Infrastructure\Persistence\Doctrine\Type\ProgramIdType
            program_version_id: App\Training\Infrastructure\Persistence\Doctrine\Type\ProgramVersionIdType
            tempo: App\Training\Infrastructure\Persistence\Doctrine\Type\TempoType
            muscles: App\Training\Infrastructure\Persistence\Doctrine\Type\MusclesType
            training_days: App\Training\Infrastructure\Persistence\Doctrine\Type\TrainingDaysType
            workout_id: App\Training\Infrastructure\Persistence\Doctrine\Type\WorkoutIdType
            program_day: App\Training\Infrastructure\Persistence\Doctrine\Type\ProgramDayRefType
            workout_exercises: App\Training\Infrastructure\Persistence\Doctrine\Type\WorkoutExercisesType
            workout_sets: App\Training\Infrastructure\Persistence\Doctrine\Type\WorkoutSetsType
            weigh_in_id: App\Progression\Infrastructure\Persistence\Doctrine\Type\WeighInIdType
            weight_goal_id: App\Progression\Infrastructure\Persistence\Doctrine\Type\WeightGoalIdType
            custom_measure_id: App\Progression\Infrastructure\Persistence\Doctrine\Type\CustomMeasureIdType
            measurement_day_id: App\Progression\Infrastructure\Persistence\Doctrine\Type\MeasurementDayIdType
            media_id: App\Shared\Infrastructure\Persistence\Doctrine\MediaIdType
            export_id: App\Export\Infrastructure\Persistence\Doctrine\Type\ExportIdType
            progress_photo_id: App\Progression\Infrastructure\Persistence\Doctrine\Type\ProgressPhotoIdType
            recommendation_id: App\Coach\Infrastructure\Persistence\Doctrine\Type\RecommendationIdType
            weekly_report_id: App\Coach\Infrastructure\Persistence\Doctrine\Type\WeeklyReportIdType
            audit_event_id: App\Audit\Infrastructure\Persistence\Doctrine\Type\AuditEventIdType
            notification_id: App\Notification\Infrastructure\Persistence\Doctrine\Type\NotificationIdType

    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        # Domain models stay free of persistence concerns: each bounded context declares
        # its XML mapping directory here (ADR-0009).
        mappings:
            Identity:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Identity\Domain'
            Nutrition:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Nutrition/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Nutrition\Domain'
            Training:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Training/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Training\Domain'
            Progression:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Progression/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Progression\Domain'
            Media:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Media/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Media\Domain'
            Export:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Export/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Export\Domain'
            Coach:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Coach/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Coach\Domain'
            Audit:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Audit/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Audit\Domain'
            Notification:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Notification/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Notification\Domain'

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
