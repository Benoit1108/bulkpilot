api_platform:
    title: '%env(APP_DISPLAY_NAME)% API'
    version: 0.1.0
    mapping:
        # Resources are presentation-layer classes: list each context's Presentation/Api directory
        # (scanning all of src/ would load Domain and Infrastructure classes too).
        paths:
            - '%kernel.project_dir%/src/System/Presentation/Api'
            - '%kernel.project_dir%/src/Identity/Presentation/Api'
            - '%kernel.project_dir%/src/Nutrition/Presentation/Api'
            - '%kernel.project_dir%/src/Training/Presentation/Api'
            - '%kernel.project_dir%/src/Progression/Presentation/Api'
            - '%kernel.project_dir%/src/Coach/Presentation/Api'
            - '%kernel.project_dir%/src/Export/Presentation/Api'
            - '%kernel.project_dir%/src/Audit/Presentation/Api'
            - '%kernel.project_dir%/src/Notification/Presentation/Api'
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    error_formats:
        jsonproblem: ['application/problem+json']
        jsonld: ['application/ld+json']
    defaults:
        # Authentication uses a same-origin session cookie (ADR-0008): operations are not stateless.
        stateless: false
        cache_headers:
            vary: ['Content-Type', 'Accept', 'Cookie']
        normalization_context:
            skip_null_values: false

when@prod:
    api_platform:
        enable_swagger_ui: false
        enable_re_doc: false
