# Handlers are bound to their Messenger bus by marker interface in Kernel::build(),
# so Application code needs no framework attribute (see docs/ARCHITECTURE.md).
services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Identity\Application\External\ExternalIdentityProviders:
        arguments:
            $providers: !tagged_iterator app.identity_provider

    # Contexts keep photos through the shared port; Media implements it (ADR-0027).
    App\Shared\Application\Media\Photos: '@App\Media\Application\PhotoLibrary'
    App\Media\Application\MediaStorage:
        factory: ['@App\Media\Infrastructure\Storage\MediaStorageFactory', 'create']
        arguments: ['%env(MEDIA_STORAGE)%']

    # The Coach reads the other contexts, and changes a calorie target, through shared ports (ADR-0028).
    App\Shared\Application\Coaching\NutritionReadings: '@App\Nutrition\Application\Coaching\JournalReadings'
    App\Shared\Application\Coaching\CalorieTargets: '@App\Nutrition\Application\Coaching\CoachCalorieTargets'
    App\Shared\Application\Coaching\BodyWeight: '@App\Progression\Application\Coaching\WeighInReadings'
    App\Shared\Application\Coaching\TrainingReadings: '@App\Training\Application\Coaching\WorkoutReadings'
    # Only the template provider for now (spec §73): a real one is chosen here, behind the same port.
    App\Coach\Application\Port\AiProvider: '@App\Coach\Infrastructure\Ai\FakeAiProvider'

    App\System\Application\Health\GetHealthHandler:
        arguments:
            $checks: !tagged_iterator app.health_check

    # Own PDO connection (not Doctrine's, whose transactions the command bus drives), opened lazily
    # per request that touches the session and closed with it.
    # No lock: the session only holds the security token and short-lived flow state, and PHP skips
    # the write when nothing changed (lazy_write), so a user's parallel requests are not serialised.
    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - '%env(DATABASE_URL)%'
            - { db_table: sessions, lock_mode: 0 }

    Psr\Log\LoggerInterface $auditLogger: '@monolog.logger.audit'
