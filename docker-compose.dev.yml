# Development: sources bind-mounted, Nuxt dev server with HMR behind Caddy, Mailpit.
# Published ports listen on 127.0.0.1 only (except the app itself).
services:
  php:
    image: ${IMAGES_PREFIX:-}bulkpilot-php-dev
    build:
      target: frankenphp_dev
    environment:
      <<: &dev-environment
        APP_SECRET: dev-only-not-a-secret
        APP_ENCRYPTION_KEY: ZGV2LW9ubHktbm90LWEtc2VjcmV0LWtleS0zMmJ5dGU= # gitleaks:allow (readable non-secret key)
        MAILER_DSN: smtp://mailer:1025
        DEFAULT_URI: https://localhost
        MAILER_FROM: no-reply@localhost
        REGISTRATION_ENABLED: "true"
        # Deterministic scans for `make e2e`; FOOD_DATABASE=openfoodfacts make up to scan real products.
        FOOD_DATABASE: ${FOOD_DATABASE:-fake}
        # Photos on the local disk (var/media), served through signed links.
        MEDIA_STORAGE: local
        XDEBUG_MODE: ${XDEBUG_MODE:-off}
      # "https://php" lets containers (e.g. Playwright) reach the app over TLS on the internal network.
      SERVER_NAME: ${SERVER_NAME:-localhost, https://php}
      CADDY_SERVER_EXTRA_DIRECTIVES: tls internal
      PWA_MODE: pwa_dev
      PWA_UPSTREAM: pwa:3000
    volumes:
      - ./api:/app
      - /app/var
      - ./api/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./api/frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    tty: true

  # Same sources as php; restart it after changing a handler (`docker compose restart worker`).
  worker:
    image: ${IMAGES_PREFIX:-}bulkpilot-php-dev
    environment:
      <<: *dev-environment
    volumes:
      - ./api:/app
      - /app/var

  pwa:
    build:
      context: ./pwa
      target: pwa_dev
    image: ${IMAGES_PREFIX:-}bulkpilot-pwa-dev
    # Same uid as the owner of the checkout, so the bind-mounted sources stay writable.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
      NUXT_PUBLIC_APP_NAME: ${APP_DISPLAY_NAME:-BulkPilot}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
      start_interval: 2s
    volumes:
      - ./pwa:/app
      - pwa_node_modules:/app/node_modules

  database:
    ports:
      - target: 5432
        published: ${POSTGRES_PORT:-5432}
        host_ip: 127.0.0.1
        protocol: tcp

  mailer:
    image: axllent/mailpit:v1.31.3
    ports:
      - target: 8025
        published: ${MAILPIT_PORT:-8025}
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  pwa_node_modules:
