name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned by commit SHA (Dependabot keeps them up to date).
jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --no-banner --redact

  qa:
    name: Lint, static analysis, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build dev images (layer cache)
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: docker-compose.yml,docker-compose.dev.yml
          targets: php,pwa
          load: true
          set: |
            *.cache-from=type=gha,scope=dev
            *.cache-to=type=gha,scope=dev,mode=max
      - name: Lint → static analysis → unit / integration / API / component tests
        run: make ci-qa UP_FLAGS=
      - name: Dependency audit
        run: |
          docker run --rm -v "$PWD/api":/app -w /app composer:2 audit --locked
          docker run --rm -v "$PWD/pwa":/app -w /app node:24-alpine sh -c 'corepack enable && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm audit --prod'

  mutation:
    name: Mutation testing (Domain, use cases)
    # After qa: the dev image is then in the layer cache, not built twice in parallel.
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build dev images (layer cache)
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: docker-compose.yml,docker-compose.dev.yml
          targets: php
          load: true
          set: |
            *.cache-from=type=gha,scope=dev
      - name: Infection on every Domain (MSI ≥ 98 %) and on the Coach, Notification and Training use cases (ratchet)
        run: make ci-mutation UP_FLAGS=

  e2e:
    name: E2E on production image
    needs: qa
    runs-on: ubuntu-latest
    # Playwright (~4 min), the backup check, ZAP (~3 min) and Lighthouse (18 audits, ~6 min) on one stack.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production image (layer cache)
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: docker-compose.yml,docker-compose.test.yml
          targets: php
          load: true
          set: |
            *.cache-from=type=gha,scope=prod
            *.cache-to=type=gha,scope=prod,mode=max
      - name: Playwright (mobile + desktop), backup check, OWASP ZAP and Lighthouse against the production image
        run: make ci-prod UP_FLAGS=
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: pwa/playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-report
          path: pwa/lighthouse-report
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zap-report
          path: zap/report
          if-no-files-found: ignore
          retention-days: 14

  perf:
    name: Load test on production image
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The dev image seeds the demo data (the command is not in the production image, ADR-0032).
      - name: Build dev image (layer cache)
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: docker-compose.yml,docker-compose.dev.yml
          targets: php
          load: true
          set: |
            *.cache-from=type=gha,scope=dev
      - name: Build production image (layer cache)
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: docker-compose.yml,docker-compose.test.yml
          targets: php
          load: true
          set: |
            *.cache-from=type=gha,scope=prod
            *.cache-to=type=gha,scope=prod,mode=max
      # A shared runner is slower and noisier than a workstation: its p95 budget is wider (k6/scenario.js).
      - name: Demo accounts with years of data, then k6 (p95 < 500 ms on CI, no error)
        env:
          K6_P95_MS: '500'
        run: make perf UP_FLAGS=
