name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The production image, built once per commit of main, tested, signed, then deployed by digest (ADR-0033).
  IMAGE: ghcr.io/${{ github.repository_owner }}/bulkpilot-php

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned by commit SHA (Dependabot keeps them up to date).
jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --no-banner --redact

  qa:
    name: Lint, static analysis, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build dev images (layer cache)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.yml,docker-compose.dev.yml
          targets: php,pwa
          load: true
          set: |
            *.cache-from=type=gha,scope=dev
            *.cache-to=type=gha,scope=dev,mode=max
      - name: Lint → static analysis → unit / integration / API / component tests
        run: make ci-qa UP_FLAGS=
      - name: Dependency audit
        run: |
          docker run --rm -v "$PWD/api":/app -w /app composer:2 audit --locked
          docker run --rm -v "$PWD/pwa":/app -w /app node:24-alpine sh -c 'corepack enable && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm audit --prod'

  ops:
    name: Server scripts and workflows (shellcheck, actionlint, deployment end to end)
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Deploys the production image to a throwaway local "server" with the server's own scripts:
      # signature gate, staging before production, rollbacks, backups, prune, the SSH gate.
      - name: Deploy, roll back and gate on a throwaway server
        run: make deploy-test

  mutation:
    name: Mutation testing (Domain, use cases)
    # After qa: the dev image is then in the layer cache, not built twice in parallel.
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build dev images (layer cache)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.yml,docker-compose.dev.yml
          targets: php
          load: true
          set: |
            *.cache-from=type=gha,scope=dev
      - name: Infection on every Domain (MSI ≥ 98 %) and on the Coach, Notification and Training use cases (ratchet)
        run: make ci-mutation UP_FLAGS=

  # main only: the production image for amd64 and arm64 (the Ampere server), each on a native runner,
  # pushed by digest; `image` merges them into one multi-arch image tagged sha-<commit>.
  image-arch:
    name: Production image (${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: qa
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      # GHCR repository names are lowercase; the owner's login may not be (env.IMAGE then reads it).
      - name: Image name in lowercase
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          target: frankenphp_prod
          build-contexts: pwa=pwa
          platforms: linux/${{ matrix.arch }}
          build-args: |
            APP_RELEASE=sha-${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=prod-${{ matrix.arch }}
          cache-to: type=gha,scope=prod-${{ matrix.arch }},mode=max
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  image:
    name: Production image (multi-arch, provenance)
    needs: image-arch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      # GHCR repository names are lowercase; the owner's login may not be (env.IMAGE then reads it).
      - name: Image name in lowercase
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One image for both architectures, tagged sha-<commit>
        id: merge
        working-directory: digests
        run: |
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create -t "$IMAGE:sha-$GITHUB_SHA" "${refs[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

  e2e:
    name: E2E on production image
    # On main, the very image `image` pushed (pulled by digest); on pull requests, one built here.
    needs: [qa, image]
    if: ${{ !cancelled() && needs.qa.result == 'success' && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Playwright (~4 min), the backup check, ZAP (~3 min) and Lighthouse (18 audits, ~6 min) on one stack.
    timeout-minutes: 45
    steps:
      # GHCR repository names are lowercase; the owner's login may not be (env.IMAGE then reads it).
      - name: Image name in lowercase
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: The image to test is the one main will deploy
        if: needs.image.result == 'success'
        env:
          REF: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
        run: docker pull "$REF" && docker tag "$REF" bulkpilot-php:latest
      - name: Build production image (layer cache)
        if: needs.image.result != 'success'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.yml,docker-compose.test.yml
          targets: php
          load: true
          set: |
            *.cache-from=type=gha,scope=prod
            *.cache-to=type=gha,scope=prod,mode=max
      - name: Playwright (mobile + desktop), backup check, OWASP ZAP and Lighthouse against the production image
        run: make ci-prod UP_FLAGS=
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: pwa/playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-report
          path: pwa/lighthouse-report
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zap-report
          path: zap/report
          if-no-files-found: ignore
          retention-days: 14

  perf:
    name: Load test on production image
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The dev image seeds the demo data (the command is not in the production image, ADR-0032).
      - name: Build dev image (layer cache)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.yml,docker-compose.dev.yml
          targets: php
          load: true
          set: |
            *.cache-from=type=gha,scope=dev
      - name: Build production image (layer cache)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.yml,docker-compose.test.yml
          targets: php
          load: true
          set: |
            *.cache-from=type=gha,scope=prod
            *.cache-to=type=gha,scope=prod,mode=max
      # A shared runner is slower and noisier than a workstation: its p95 budget is wider (k6/scenario.js).
      - name: Demo accounts with years of data, then k6 (p95 < 500 ms on CI, no error)
        env:
          K6_P95_MS: '500'
        run: make perf UP_FLAGS=

  # The image passed every test: signed, so that the server accepts it (deploy.sh checks this
  # signature: cosign keyless, the identity of this workflow on main), then old versions pruned.
  sign:
    name: Sign the tested image
    needs: [image, e2e, perf, mutation, ops, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # GHCR repository names are lowercase; the owner's login may not be (env.IMAGE then reads it).
      - name: Image name in lowercase
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: cosign sign (keyless)
        env:
          REF: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
        run: cosign sign --yes "$REF"
      # Promotable images must never vanish: the last ~30 commits stay (index + 2 architectures +
      # signature and attestation each).
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: bulkpilot-php
          package-type: container
          min-versions-to-keep: 180
