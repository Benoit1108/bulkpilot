# Base stack shared by every environment; always combined with an override through `make`:
#   dev:  make up        (docker-compose.dev.yml)
#   e2e:  make e2e-prod  (docker-compose.test.yml: production image, throwaway data)
# Used alone it runs the production image locally (APP_SECRET must then be provided).
name: ${COMPOSE_PROJECT_NAME:-bulkpilot}

services:
  php:
    image: ${IMAGES_PREFIX:-}bulkpilot-php:${IMAGE_TAG:-latest}
    build:
      context: ./api
      target: frankenphp_prod
      additional_contexts:
        pwa: ./pwa
    restart: unless-stopped
    environment: &php-environment
      SERVER_NAME: ${SERVER_NAME:-localhost}
      APP_SECRET: ${APP_SECRET:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      # Checked at start-up in production (docker-entrypoint.sh): email links must work.
      DEFAULT_URI: ${DEFAULT_URI:-}
      MAILER_DSN: ${MAILER_DSN:-}
      MAILER_FROM: ${MAILER_FROM:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FOOD_DATABASE: ${FOOD_DATABASE:-openfoodfacts}
      OPEN_FOOD_FACTS_USER_AGENT: ${OPEN_FOOD_FACTS_USER_AGENT:-BulkPilot/0.1 (self-hosted personal app)}
      # Progress photos: a private S3-compatible bucket (ADR-0027).
      MEDIA_STORAGE: ${MEDIA_STORAGE:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-18}&charset=utf8
      FRANKENPHP_CONFIG: ${FRANKENPHP_CONFIG:-}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp

  # Asynchronous work and the schedules (ADR-0029): the checks behind the notifications every
  # quarter of an hour, the Coach's nightly analyses. Same image and settings as php, which runs
  # the migrations first; the worker stops every hour (and on memory growth) to be restarted fresh.
  worker:
    image: ${IMAGES_PREFIX:-}bulkpilot-php:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["bin/console", "messenger:consume", "async", "scheduler_notifications", "scheduler_coach", "--time-limit=3600", "--memory-limit=192M"]
    environment:
      <<: *php-environment
      RUN_MIGRATIONS: "0"
    # The image's check calls the web server, which the worker does not run: check the consumer
    # itself is the container's process (the entrypoint execs it).
    healthcheck:
      test: ["CMD-SHELL", "grep -q messenger:consume /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    depends_on:
      php:
        condition: service_healthy

  database:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s
    volumes:
      - database_data:/var/lib/postgresql

  # Playwright, run on demand against the stack it is attached to (`make e2e` / `make e2e-prod`).
  # The image tag follows the exact @playwright/test version pinned in pwa/package.json.
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION:-unset}-noble
    working_dir: /work
    ipc: host
    environment:
      CI: ${CI:-}
      E2E_BASE_URL: https://php
      MAILPIT_URL: http://mailer:8025
      PLAYWRIGHT_ARGS: ${PLAYWRIGHT_ARGS:-}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    volumes:
      - ./pwa:/work
      - e2e_node_modules:/work/node_modules
    command:
      - sh
      - -c
      - |
        corepack pnpm install --frozen-lockfile --ignore-scripts --reporter=silent || exit 1
        corepack pnpm exec playwright test $$PLAYWRIGHT_ARGS; status=$$?
        chown -R "$$HOST_UID:$$HOST_GID" test-results playwright-report 2>/dev/null
        exit $$status

volumes:
  caddy_data:
  caddy_config:
  database_data:
  e2e_node_modules:
